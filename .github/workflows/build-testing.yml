name: Build reF1nd testing Android arm64 and Windows amd64

on:
  workflow_dispatch:
    inputs:

      tag:
        description: "Upstream release tag; leave empty for latest"
        required: false
        type: string
      force_build:
        description: "Build even if the release already exists"
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "37 20 * * *"

permissions:
  contents: write

concurrency:
  group: auto-ref1nd-testing
  cancel-in-progress: false

jobs:
  build:
    name: Build testing Android arm64 and Windows amd64
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM_SOURCE_REPO: reF1nd/sing-box
      UPSTREAM_RELEASE_REPO: reF1nd/sing-box-releases
      UPSTREAM_BRANCH: reF1nd-testing
      ANDROID_CLIENT_BRANCH: dev
      PATCH_FILE: patches/provider.patch
      INPUT_TAG: ${{ inputs.tag }}
      FORCE_BUILD: ${{ inputs.force_build }}
    steps:
      - name: Checkout build recipes
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5


      - name: Prepare/resolve tag
        id: prepare
        run: |
          set -euo pipefail

          : "${GH_TOKEN:?GH_TOKEN is required}"
          : "${GITHUB_REPOSITORY:?GITHUB_REPOSITORY is required}"

          workspace="${GITHUB_WORKSPACE:-$(pwd)}"
          source_dir="${workspace}/source"
          dist_dir="${workspace}/dist"
          input_tag="${INPUT_TAG:-}"
          force_build="${FORCE_BUILD:-false}"
          prerelease_flag=true
          release_title_suffix=testing
          latest_tag_query='[.[] | select(.isPrerelease == true and (.tagName | test("-(alpha|beta|rc)[.-]")))][0].tagName // ""'

          if [[ -n "${input_tag}" ]]; then
            tag="${input_tag}"
          else
            tag="$(gh release list --repo "${UPSTREAM_RELEASE_REPO}" --limit 100 --json tagName,isPrerelease --jq "${latest_tag_query}")"
          fi
          if [[ -z "${tag}" || "${tag}" != v* ]]; then
            echo "Invalid upstream release tag: ${tag}" >&2
            exit 1
          fi
          actual_prerelease="$(gh release view "${tag}" --repo "${UPSTREAM_RELEASE_REPO}" --json isPrerelease --jq .isPrerelease)"
          if [[ "${actual_prerelease}" != "${prerelease_flag}" ]]; then
            echo "Tag ${tag} prerelease=${actual_prerelease}, expected ${prerelease_flag} for testing" >&2
            exit 1
          fi
          if [[ ! "${tag}" =~ -(alpha|beta|rc)[.-] ]]; then
            echo "Testing tag must contain alpha, beta, or rc: ${tag}" >&2
            exit 1
          fi

          {
            echo "TAG=${tag}"
            echo "VERSION=${tag#v}"
            echo "RELEASE_TITLE_SUFFIX=${release_title_suffix}"
            echo "WORKSPACE=${workspace}"
            echo "SOURCE_DIR=${source_dir}"
            echo "DIST_DIR=${dist_dir}"
          } >> "${GITHUB_ENV}"

      - name: Check release
        if: env.TAG != ''
        run: |
          set -euo pipefail

          force_build="${FORCE_BUILD:-false}"
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 && [[ "${force_build}" != true ]]; then
            echo "Release ${TAG} already exists in ${GITHUB_REPOSITORY}; set force_build=true to rebuild."
            echo "SKIP_BUILD=true" >> "${GITHUB_ENV}"
          fi

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.6
          cache: false

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Setup OpenJDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-provider: basic

      - name: Cache Go modules & build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-testing-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-go-testing-
            ${{ runner.os }}-go-

      - name: Clone source
        if: env.SKIP_BUILD != 'true'
        run: |
          set -euo pipefail

          if ! git ls-remote --exit-code --heads "https://github.com/${UPSTREAM_SOURCE_REPO}.git" "refs/heads/${UPSTREAM_BRANCH}" >/dev/null; then
            echo "Source branch ${UPSTREAM_BRANCH} not found in ${UPSTREAM_SOURCE_REPO}" >&2
            exit 1
          fi
          rm -rf "${SOURCE_DIR}" "${DIST_DIR}"
          git clone --depth 1 --branch "${UPSTREAM_BRANCH}" --single-branch "https://github.com/${UPSTREAM_SOURCE_REPO}.git" "${SOURCE_DIR}"

      - name: Checkout Android client
        if: env.SKIP_BUILD != 'true'
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -euo pipefail
          git submodule update --init clients/android
          cd clients/android
          git checkout "${ANDROID_CLIENT_BRANCH}" || true
          git submodule update --init --recursive -v

      - name: Apply patch
        if: env.SKIP_BUILD != 'true'
        run: |
          set -euo pipefail

          patch_path="${WORKSPACE}/${PATCH_FILE}"
          [[ -f "${patch_path}" ]] || { echo "Patch file not found: ${patch_path}" >&2; exit 1; }
          cd "${SOURCE_DIR}"
          echo "Applying patch: ${patch_path}"
          if git apply --check "${patch_path}" 2>/dev/null; then
            git apply "${patch_path}"
            echo "Patch applied cleanly"
          else
            echo "Patch does not apply. Details:" >&2
            git apply --check -v "${patch_path}" >&2 || true
            exit 1
          fi

      - name: Test provider
        if: env.SKIP_BUILD != 'true'
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -euo pipefail
          go test ./adapter/provider

      - name: Setup build variables
        if: env.SKIP_BUILD != 'true'
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -euo pipefail

          echo "ANDROID_BUILD_TAGS=$(cat release/DEFAULT_BUILD_TAGS_OTHERS),with_ebpf" >> "${GITHUB_ENV}"
          echo "WINDOWS_BUILD_TAGS=$(cat release/DEFAULT_BUILD_TAGS_WINDOWS)" >> "${GITHUB_ENV}"
          echo "LDFLAGS_SHARED=$(cat release/LDFLAGS)" >> "${GITHUB_ENV}"
          go install -v ./cmd/internal/build

      - name: Generate eBPF
        if: env.SKIP_BUILD != 'true'
        working-directory: ${{ env.SOURCE_DIR }}
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail

          if [[ -d common/ebpf ]]; then
            make -C common/ebpf generate
            [[ -f common/ebpf/internal/bpfgen/shared_network_bpfel.o ]] || { echo "eBPF object was not generated" >&2; exit 1; }
          fi

      - name: Build Android
        if: env.SKIP_BUILD != 'true'
        working-directory: ${{ env.SOURCE_DIR }}
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          CC: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android23-clang
          CXX: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android23-clang++
        run: |
          set -euo pipefail

          android_package_name="sing-box-${VERSION}-android-arm64"
          android_package_dir="${DIST_DIR}/${android_package_name}"
          mkdir -p "${android_package_dir}"
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 build go build -v -trimpath -o "${android_package_dir}/sing-box" -tags "${ANDROID_BUILD_TAGS}" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' ${LDFLAGS_SHARED} -s -w -buildid=" ./cmd/sing-box
          chmod +x "${android_package_dir}/sing-box"
          cp LICENSE "${android_package_dir}/LICENSE"

      - name: Package Android
        if: env.SKIP_BUILD != 'true'
        run: |
          set -euo pipefail

          android_package_name="sing-box-${VERSION}-android-arm64"
          android_package_dir="${DIST_DIR}/${android_package_name}"
          android_archive="${DIST_DIR}/${android_package_name}.zip"
          (cd "${DIST_DIR}" && zip -q -r "${android_archive}" "${android_package_name}")
          rm -rf "${android_package_dir}"

      - name: Build Android library
        if: env.SKIP_BUILD != 'true'
        working-directory: ${{ env.SOURCE_DIR }}
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail

          make lib_install
          export PATH="$(go env GOPATH)/bin:${PATH}"
          git tag "${TAG}" -f
          go run ./cmd/internal/build_libbox -target android -platform android/arm64
          mkdir -p clients/android/app/libs
          cp libbox.aar libbox-legacy.aar clients/android/app/libs/

      - name: Build Android APK
        if: env.SKIP_BUILD != 'true'
        working-directory: ${{ env.SOURCE_DIR }}
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          LOCAL_PROPERTIES_SECRET: ${{ secrets.LOCAL_PROPERTIES }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          go run -v ./cmd/internal/update_android_version --ci --nightly

          if [[ -n "${LOCAL_PROPERTIES_SECRET:-}" && -n "${RELEASE_KEYSTORE_BASE64:-}" ]]; then
            echo "Using configured release keystore and credentials from secrets."
            echo "${RELEASE_KEYSTORE_BASE64}" | base64 --decode > clients/android/app/release.keystore
            export LOCAL_PROPERTIES="${LOCAL_PROPERTIES_SECRET}"
          elif [[ -n "${LOCAL_PROPERTIES_SECRET:-}" ]]; then
            echo "Using configured LOCAL_PROPERTIES."
            export LOCAL_PROPERTIES="${LOCAL_PROPERTIES_SECRET}"
          else
            echo "No keystore secrets configured, generating self-signed keystore for release build..."
            keytool -genkeypair -v \
              -keystore clients/android/app/release.keystore \
              -alias sing-box \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=sing-box, OU=sing-box, O=sing-box, L=Unknown, ST=Unknown, C=US"
            local_props_content=$(printf "KEYSTORE_PASS=android\nALIAS_NAME=sing-box\nALIAS_PASS=android\n")
            export LOCAL_PROPERTIES=$(echo -n "${local_props_content}" | base64 -w 0)
          fi

          cd clients/android
          ./gradlew --build-cache --parallel :app:assembleOtherRelease

          apk_file=$(find app/build/outputs/apk/other/release -name "*arm64-v8a.apk" | head -n 1)
          if [[ -z "${apk_file}" || ! -f "${apk_file}" ]]; then
            echo "arm64 APK not found in app/build/outputs/apk/other/release" >&2
            exit 1
          fi

          apk_name=$(basename "${apk_file}")
          echo "Found arm64 APK: ${apk_name}"
          cp "${apk_file}" "${DIST_DIR}/${apk_name}"
          echo "APK_NAME=${apk_name}" >> "${GITHUB_ENV}"

      - name: Build Windows
        if: env.SKIP_BUILD != 'true'
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -euo pipefail

          windows_package_name="sing-box-${VERSION}-windows-amd64"
          windows_package_dir="${DIST_DIR}/${windows_package_name}"
          mkdir -p "${windows_package_dir}"
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -v -trimpath -o "${windows_package_dir}/sing-box.exe" -tags "${WINDOWS_BUILD_TAGS}" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' ${LDFLAGS_SHARED} -s -w -buildid=" ./cmd/sing-box
          cp LICENSE "${windows_package_dir}/LICENSE"

      - name: Fetch/package libcronet
        if: env.SKIP_BUILD != 'true'
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -euo pipefail

          windows_package_name="sing-box-${VERSION}-windows-amd64"
          windows_package_dir="${DIST_DIR}/${windows_package_name}"
          cronet_go_version="$(cat .github/CRONET_GO_VERSION)"
          cronet_dir="$(mktemp -d)"
          trap 'rm -rf "${cronet_dir}"' EXIT
          git init "${cronet_dir}"
          git -C "${cronet_dir}" remote add origin https://github.com/sagernet/cronet-go.git
          git -C "${cronet_dir}" sparse-checkout set --no-cone "/lib/windows_amd64/libcronet.dll"
          git -C "${cronet_dir}" fetch --depth=1 --filter=blob:none origin "${cronet_go_version}"
          git -C "${cronet_dir}" checkout FETCH_HEAD
          if [[ -f "${cronet_dir}/lib/windows_amd64/libcronet.dll" ]]; then
            cp "${cronet_dir}/lib/windows_amd64/libcronet.dll" "${windows_package_dir}/libcronet.dll"
          else
            rm -rf "${cronet_dir}"; mkdir -p "${cronet_dir}"; git init "${cronet_dir}"
            git -C "${cronet_dir}" remote add origin https://github.com/sagernet/cronet-go.git
            git -C "${cronet_dir}" fetch --depth=1 origin "${cronet_go_version}"; git -C "${cronet_dir}" checkout FETCH_HEAD
            CGO_ENABLED=0 go -C "${cronet_dir}" build -v -o "${cronet_dir}/build-naive" ./cmd/build-naive
            GOPROXY=direct GOSUMDB=off "${cronet_dir}/build-naive" extract-lib --target windows/amd64 -o "${windows_package_dir}"
          fi
          [[ -f "${windows_package_dir}/libcronet.dll" ]] || { echo "libcronet.dll is missing" >&2; exit 1; }

      - name: Package Windows
        if: env.SKIP_BUILD != 'true'
        run: |
          set -euo pipefail

          windows_package_name="sing-box-${VERSION}-windows-amd64"
          windows_package_dir="${DIST_DIR}/${windows_package_name}"
          windows_archive="${DIST_DIR}/${windows_package_name}.zip"
          (cd "${DIST_DIR}" && zip -q -r "${windows_archive}" "${windows_package_name}")
          rm -rf "${windows_package_dir}"

      - name: Publish release
        if: env.SKIP_BUILD != 'true'
        run: |
          set -euo pipefail

          source_sha="$(git -C "${SOURCE_DIR}" rev-parse HEAD)"
          release_page_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          download_base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          android_package_name="sing-box-${VERSION}-android-arm64"
          windows_package_name="sing-box-${VERSION}-windows-amd64"
          android_archive="${DIST_DIR}/${android_package_name}.zip"
          windows_archive="${DIST_DIR}/${windows_package_name}.zip"
          apk_path="${DIST_DIR}/${APK_NAME}"
          notes="$(cat <<EOF
          Automated reF1nd ${RELEASE_TITLE_SUFFIX} builds for Android arm64 and Windows amd64.

          | 项目 | 信息 |
          | --- | --- |
          | Release | [${TAG}](${release_page_url}) |
          | 源码 | [${UPSTREAM_SOURCE_REPO}@${UPSTREAM_BRANCH}](https://github.com/${UPSTREAM_SOURCE_REPO}/tree/${UPSTREAM_BRANCH}) |
          | 源码提交 | [${source_sha}](https://github.com/${UPSTREAM_SOURCE_REPO}/commit/${source_sha}) |
          | 补丁 | [${PATCH_FILE}](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/${PATCH_FILE}) |

          | 平台 | 架构 | 下载 |
          | --- | --- | --- |
          | Android (APK) | arm64 | [${APK_NAME}](${download_base_url}/${APK_NAME}) |
          | Android (Core) | arm64 | [${android_package_name}.zip](${download_base_url}/${android_package_name}.zip) |
          | Windows (Core) | amd64 | [${windows_package_name}.zip](${download_base_url}/${windows_package_name}.zip) |
          EOF
          )"

          release_assets=("${android_archive}" "${windows_archive}" "${apk_path}")
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" --repo "${GITHUB_REPOSITORY}" "${release_assets[@]}" --clobber
            gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false --prerelease --notes "${notes}"
          else
            gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --title "${TAG}" --notes "${notes}" --prerelease "${release_assets[@]}"
          fi
