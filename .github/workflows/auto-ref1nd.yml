name: Auto reF1nd Android arm64 and Windows amd64

on:
  workflow_dispatch:
    inputs:
      release_kind:
        description: "Release kind (stable or testing)"
        required: true
        type: choice
        options:
          - stable
          - testing
        default: testing
      tag:
        description: "Upstream release tag; leave empty for latest"
        required: false
        type: string
      force_build:
        description: "Build even if the release already exists"
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "17 20 * * *"  # stable
    - cron: "37 20 * * *"  # testing

permissions:
  contents: write

concurrency:
  group: auto-ref1nd-${{ github.event.inputs.release_kind || 'scheduled' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.release_kind }} Android arm64 and Windows amd64
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - release_kind: stable
            cron: "17 20 * * *"
          - release_kind: testing
            cron: "37 20 * * *"
      fail-fast: false
    steps:
      - name: Checkout build recipes
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ~1.25.10
          cache: false

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28
          local-cache: true

      - name: Cache Go modules & build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.release_kind }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.release_kind }}-
            ${{ runner.os }}-go-

      - name: Build and publish
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.release_kind == matrix.release_kind) ||
          (github.event_name == 'schedule' && github.event.schedule == matrix.cron)
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SOURCE_REPO: reF1nd/sing-box
          UPSTREAM_RELEASE_REPO: reF1nd/sing-box-releases
          UPSTREAM_STABLE_BRANCH: reF1nd-stable
          UPSTREAM_TESTING_BRANCH: reF1nd-testing
          RELEASE_KIND: ${{ matrix.release_kind }}
          PATCH_FILE: patches/provider.patch
          INPUT_TAG: ${{ inputs.tag }}
          FORCE_BUILD: ${{ inputs.force_build }}
        run: bash scripts/build-release.sh
