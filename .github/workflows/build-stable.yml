name: Build stable

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream release tag; leave empty for latest"
        required: false
        type: string
      force_build:
        description: "Build even if the release already exists"
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "17 20 * * *"

permissions:
  contents: write

concurrency:
  group: auto-ref1nd-stable
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare build & resolve tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      skip_build: ${{ steps.resolve.outputs.skip_build }}
    steps:
      - name: Prepare/resolve tag
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SOURCE_REPO: reF1nd/sing-box
          UPSTREAM_RELEASE_REPO: reF1nd/sing-box-releases
          UPSTREAM_BRANCH: reF1nd-stable
          INPUT_TAG: ${{ inputs.tag }}
          FORCE_BUILD: ${{ inputs.force_build }}
          PRERELEASE_FLAG: false
          LATEST_TAG_QUERY: '[.[] | select(.isPrerelease == false and (.tagName | startswith("v")))][0].tagName // ""'
        run: |
          set -euo pipefail

          : "${GH_TOKEN:?GH_TOKEN is required}"
          : "${GITHUB_REPOSITORY:?GITHUB_REPOSITORY is required}"

          input_tag="${INPUT_TAG:-}"
          force_build="${FORCE_BUILD:-false}"

          if [[ -n "${input_tag}" ]]; then
            tag="${input_tag}"
          else
            tag="$(gh release list --repo "${UPSTREAM_RELEASE_REPO}" --limit 100 --json tagName,isPrerelease --jq "${LATEST_TAG_QUERY}")"
          fi
          if [[ -z "${tag}" || "${tag}" != v* ]]; then
            echo "Invalid upstream release tag: ${tag}" >&2
            exit 1
          fi
          actual_prerelease="$(gh release view "${tag}" --repo "${UPSTREAM_RELEASE_REPO}" --json isPrerelease --jq .isPrerelease)"
          if [[ "${actual_prerelease}" != "${PRERELEASE_FLAG}" ]]; then
            echo "Tag ${tag} prerelease=${actual_prerelease}, expected ${PRERELEASE_FLAG} for stable" >&2
            exit 1
          fi

          skip_build=false
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 && [[ "${force_build}" != true ]]; then
            echo "Release ${tag} already exists in ${GITHUB_REPOSITORY}; set force_build=true to rebuild."
            skip_build=true
          fi

          source_sha="$(git ls-remote "https://github.com/${UPSTREAM_SOURCE_REPO}.git" "refs/heads/${UPSTREAM_BRANCH}" | cut -f1)"

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"
          echo "skip_build=${skip_build}" >> "$GITHUB_OUTPUT"

  build_android_cli:
    name: Build Android arm64 CLI
    needs: prepare
    if: needs.prepare.outputs.skip_build != 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      UPSTREAM_SOURCE_REPO: reF1nd/sing-box
      UPSTREAM_BRANCH: reF1nd-stable
      PATCH_FILE: patches/provider.patch
    steps:
      - name: Checkout build recipes
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ~1.25.10
          cache: false

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Clone source
        run: |
          set -euo pipefail
          rm -rf source dist
          git clone --depth 1 --branch "${UPSTREAM_BRANCH}" --single-branch "https://github.com/${UPSTREAM_SOURCE_REPO}.git" source

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-mod-${{ hashFiles('source/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-

      - name: Apply patch
        working-directory: source
        run: |
          set -euo pipefail
          patch_path="${GITHUB_WORKSPACE}/${PATCH_FILE}"
          [[ -f "${patch_path}" ]] || { echo "Patch file not found: ${patch_path}" >&2; exit 1; }
          if git apply --check "${patch_path}" 2>/dev/null; then
            git apply "${patch_path}"
            echo "Patch applied cleanly"
          else
            echo "Patch does not apply. Details:" >&2
            git apply --check -v "${patch_path}" >&2 || true
            exit 1
          fi

      - name: Build Android CLI
        working-directory: source
        run: |
          set -euo pipefail
          go install -v ./cmd/internal/build
          if [[ -d common/ebpf ]]; then
            make -C common/ebpf generate
            [[ -f common/ebpf/internal/bpfgen/shared_network_bpfel.o ]] || { echo "eBPF object was not generated" >&2; exit 1; }
          fi

          package_name="sing-box-${VERSION}-android-arm64"
          package_dir="${GITHUB_WORKSPACE}/dist/${package_name}"
          mkdir -p "${package_dir}"

          android_tags="$(cat release/DEFAULT_BUILD_TAGS_OTHERS),with_ebpf"
          ldflags_shared="$(cat release/LDFLAGS)"

          CC="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android23-clang" \
          CXX="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android23-clang++" \
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 build go build -v -trimpath -o "${package_dir}/sing-box" -tags "${android_tags}" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' ${ldflags_shared} -s -w -buildid=" ./cmd/sing-box
          chmod +x "${package_dir}/sing-box"
          cp LICENSE "${package_dir}/LICENSE"
          (cd "${GITHUB_WORKSPACE}/dist" && zip -q -r "${package_name}.zip" "${package_name}")
          rm -rf "${package_dir}"

      - name: Upload Android CLI archive
        uses: actions/upload-artifact@v4
        with:
          name: artifact-android-arm64
          path: dist/sing-box-*-android-arm64.zip
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  build_windows_cli:
    name: Build Windows amd64 CLI
    needs: prepare
    if: needs.prepare.outputs.skip_build != 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      UPSTREAM_SOURCE_REPO: reF1nd/sing-box
      UPSTREAM_BRANCH: reF1nd-stable
      PATCH_FILE: patches/provider.patch
    steps:
      - name: Checkout build recipes
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ~1.25.10
          cache: false

      - name: Clone source
        run: |
          set -euo pipefail
          rm -rf source dist
          git clone --depth 1 --branch "${UPSTREAM_BRANCH}" --single-branch "https://github.com/${UPSTREAM_SOURCE_REPO}.git" source

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-mod-${{ hashFiles('source/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-

      - name: Apply patch
        working-directory: source
        run: |
          set -euo pipefail
          patch_path="${GITHUB_WORKSPACE}/${PATCH_FILE}"
          [[ -f "${patch_path}" ]] || { echo "Patch file not found: ${patch_path}" >&2; exit 1; }
          if git apply --check "${patch_path}" 2>/dev/null; then
            git apply "${patch_path}"
            echo "Patch applied cleanly"
          else
            echo "Patch does not apply. Details:" >&2
            git apply --check -v "${patch_path}" >&2 || true
            exit 1
          fi

      - name: Build Windows CLI
        working-directory: source
        run: |
          set -euo pipefail
          package_name="sing-box-${VERSION}-windows-amd64"
          package_dir="${GITHUB_WORKSPACE}/dist/${package_name}"
          mkdir -p "${package_dir}"

          windows_tags="$(cat release/DEFAULT_BUILD_TAGS_WINDOWS)"
          ldflags_shared="$(cat release/LDFLAGS)"

          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -v -trimpath -o "${package_dir}/sing-box.exe" -tags "${windows_tags}" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' ${ldflags_shared} -s -w -buildid=" ./cmd/sing-box
          cp LICENSE "${package_dir}/LICENSE"

          cronet_go_version="$(cat .github/CRONET_GO_VERSION)"
          cronet_dir="$(mktemp -d)"
          trap 'rm -rf "${cronet_dir}"' EXIT
          git init "${cronet_dir}"
          git -C "${cronet_dir}" remote add origin https://github.com/sagernet/cronet-go.git
          git -C "${cronet_dir}" sparse-checkout set --no-cone "/lib/windows_amd64/libcronet.dll"
          git -C "${cronet_dir}" fetch --depth=1 --filter=blob:none origin "${cronet_go_version}"
          git -C "${cronet_dir}" checkout FETCH_HEAD
          if [[ -f "${cronet_dir}/lib/windows_amd64/libcronet.dll" ]]; then
            cp "${cronet_dir}/lib/windows_amd64/libcronet.dll" "${package_dir}/libcronet.dll"
          else
            rm -rf "${cronet_dir}"; mkdir -p "${cronet_dir}"; git init "${cronet_dir}"
            git -C "${cronet_dir}" remote add origin https://github.com/sagernet/cronet-go.git
            git -C "${cronet_dir}" fetch --depth=1 origin "${cronet_go_version}"; git -C "${cronet_dir}" checkout FETCH_HEAD
            CGO_ENABLED=0 go -C "${cronet_dir}" build -v -o "${cronet_dir}/build-naive" ./cmd/build-naive
            GOPROXY=direct GOSUMDB=off "${cronet_dir}/build-naive" extract-lib --target windows/amd64 -o "${package_dir}"
          fi
          [[ -f "${package_dir}/libcronet.dll" ]] || { echo "libcronet.dll is missing" >&2; exit 1; }
          (cd "${GITHUB_WORKSPACE}/dist" && zip -q -r "${package_name}.zip" "${package_name}")
          rm -rf "${package_dir}"

      - name: Upload Windows CLI archive
        uses: actions/upload-artifact@v4
        with:
          name: artifact-windows-amd64
          path: dist/sing-box-*-windows-amd64.zip
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  build_android_apk:
    name: Build Android arm64 APK
    needs: prepare
    if: needs.prepare.outputs.skip_build != 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      UPSTREAM_SOURCE_REPO: reF1nd/sing-box
      UPSTREAM_BRANCH: reF1nd-stable
      UPSTREAM_ANDROID_REPO: reF1nd/sing-box-for-android
      ANDROID_BRANCH: reF1nd-stable
      PATCH_FILE: patches/provider.patch
      LOCAL_PROPERTIES_SECRET: ${{ secrets.LOCAL_PROPERTIES }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4g -XX:+UseParallelGC' -Dorg.gradle.parallel=true"
    steps:
      - name: Checkout build recipes
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ~1.25.10
          cache: false

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Setup OpenJDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-provider: basic

      - name: Clone sing-box source
        run: |
          set -euo pipefail
          rm -rf source dist sing-box-for-android
          git clone --depth 1 --branch "${UPSTREAM_BRANCH}" --single-branch "https://github.com/${UPSTREAM_SOURCE_REPO}.git" source

      - name: Clone Android client
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${ANDROID_BRANCH}" --single-branch "https://github.com/${UPSTREAM_ANDROID_REPO}.git" sing-box-for-android
          git -C sing-box-for-android submodule update --init --recursive -v || true

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-mod-${{ hashFiles('source/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-

      - name: Apply patch
        working-directory: source
        run: |
          set -euo pipefail
          patch_path="${GITHUB_WORKSPACE}/${PATCH_FILE}"
          [[ -f "${patch_path}" ]] || { echo "Patch file not found: ${patch_path}" >&2; exit 1; }
          if git apply --check "${patch_path}" 2>/dev/null; then
            git apply "${patch_path}"
            echo "Patch applied cleanly"
          else
            echo "Patch does not apply. Details:" >&2
            git apply --check -v "${patch_path}" >&2 || true
            exit 1
          fi

      - name: Build Android library
        working-directory: source
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          make lib_install
          export PATH="$(go env GOPATH)/bin:${PATH}"
          git tag "${TAG}" -f
          # 优化点1：跳过无用的 legacy 变体二次编译，只编译需要的 SDK 24 libbox.aar
          sed -i '/Build legacy variant/i \    return' cmd/internal/build_libbox/main.go
          go run ./cmd/internal/build_libbox -target android -platform android/arm64
          mkdir -p "${GITHUB_WORKSPACE}/sing-box-for-android/app/libs"
          cp libbox.aar "${GITHUB_WORKSPACE}/sing-box-for-android/app/libs/libbox.aar"
          cp libbox.aar "${GITHUB_WORKSPACE}/sing-box-for-android/app/libs/libbox-legacy.aar"

      - name: Build Android APK
        working-directory: sing-box-for-android
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/dist"
          sed -i "s/^VERSION_NAME=.*/VERSION_NAME=${VERSION}/" version.properties

          if [[ -n "${LOCAL_PROPERTIES_SECRET:-}" && -n "${RELEASE_KEYSTORE_BASE64:-}" ]]; then
            echo "Using configured release keystore and credentials from secrets."
            echo "${RELEASE_KEYSTORE_BASE64}" | base64 --decode > app/release.keystore
            export LOCAL_PROPERTIES="${LOCAL_PROPERTIES_SECRET}"
          elif [[ -n "${LOCAL_PROPERTIES_SECRET:-}" ]]; then
            echo "Using configured LOCAL_PROPERTIES."
            export LOCAL_PROPERTIES="${LOCAL_PROPERTIES_SECRET}"
          else
            echo "No keystore secrets configured, generating self-signed keystore for release build..."
            keytool -genkeypair -v \
              -keystore app/release.keystore \
              -alias sing-box \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=sing-box, OU=sing-box, O=sing-box, L=Unknown, ST=Unknown, C=US"
            local_props_content=$(printf "KEYSTORE_PASS=android\nALIAS_NAME=sing-box\nALIAS_PASS=android\n")
            export LOCAL_PROPERTIES=$(echo -n "${local_props_content}" | base64 -w 0)
          fi

          # 优化点2：精简打包目标，避免重复生成 5 个不同 ABI 的 APK 包
          sed -i 's/include("armeabi-v7a", "arm64-v8a", "x86", "x86_64")/include("arm64-v8a")/' app/build.gradle.kts
          sed -i 's/isUniversalApk = true/isUniversalApk = false/' app/build.gradle.kts

          chmod +x gradlew
          # 优化点3：跳过无用的静态检查和单测，直奔 APK 打包
          ./gradlew --build-cache --parallel --no-daemon :app:assembleOtherRelease \
            -x lint -x lintVitalOtherRelease -x test -x detekt

          apk_file=$(find app/build/outputs/apk/other/release -name "*arm64-v8a.apk" | head -n 1)
          if [[ -z "${apk_file}" || ! -f "${apk_file}" ]]; then
            echo "arm64 APK not found in app/build/outputs/apk/other/release" >&2
            exit 1
          fi

          apk_name=$(basename "${apk_file}")
          echo "Found arm64 APK: ${apk_name}"
          cp "${apk_file}" "${GITHUB_WORKSPACE}/dist/${apk_name}"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: artifact-android-apk
          path: dist/*.apk
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [prepare, build_android_cli, build_windows_cli, build_android_apk]
    if: needs.prepare.outputs.skip_build != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      UPSTREAM_SOURCE_REPO: reF1nd/sing-box
      UPSTREAM_BRANCH: reF1nd-stable
      PATCH_FILE: patches/provider.patch
      RELEASE_TITLE_SUFFIX: stable
      PRERELEASE_FLAG: false
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: artifact-*
          path: dist
          merge-multiple: true

      - name: Publish release
        run: |
          set -euo pipefail

          release_page_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          download_base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          android_package_name="sing-box-${VERSION}-android-arm64"
          windows_package_name="sing-box-${VERSION}-windows-amd64"
          android_archive="dist/${android_package_name}.zip"
          windows_archive="dist/${windows_package_name}.zip"

          apk_file=$(find dist -name "*arm64-v8a.apk" | head -n 1)
          if [[ -z "${apk_file}" || ! -f "${apk_file}" ]]; then
            echo "APK file missing in dist" >&2
            exit 1
          fi
          apk_name=$(basename "${apk_file}")

          notes="$(cat <<EOF
          Automated reF1nd ${RELEASE_TITLE_SUFFIX} builds for Android arm64 and Windows amd64.

          | 项目 | 信息 |
          | --- | --- |
          | Release | [${TAG}](${release_page_url}) |
          | 源码 | [${UPSTREAM_SOURCE_REPO}@${UPSTREAM_BRANCH}](https://github.com/${UPSTREAM_SOURCE_REPO}/tree/${UPSTREAM_BRANCH}) |
          | 源码提交 | [${SOURCE_SHA}](https://github.com/${UPSTREAM_SOURCE_REPO}/commit/${SOURCE_SHA}) |
          | 补丁 | [${PATCH_FILE}](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/${PATCH_FILE}) |

          | 平台 | 架构 | 下载 |
          | --- | --- | --- |
          | Android (APK) | arm64 | [${apk_name}](${download_base_url}/${apk_name}) |
          | Android (Core) | arm64 | [${android_package_name}.zip](${download_base_url}/${android_package_name}.zip) |
          | Windows (Core) | amd64 | [${windows_package_name}.zip](${download_base_url}/${windows_package_name}.zip) |
          EOF
          )"

          release_assets=("${android_archive}" "${windows_archive}" "${apk_file}")
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" --repo "${GITHUB_REPOSITORY}" "${release_assets[@]}" --clobber
            gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false --prerelease=false --notes "${notes}"
          else
            gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --title "${TAG}" --notes "${notes}" "${release_assets[@]}"
          fi
